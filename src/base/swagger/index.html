<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html
        {
            box-sizing: border-box;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after
        {
            box-sizing: inherit;
        }

        body
        {
            margin: 0;
            background: #fafafa;
        }

        .topbar
        {
            display: none;
        }

        .loading
        {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            color: #3b4151;
            font-size: 1.2em;
        }

        .loading .spinner
        {
            width: 24px;
            height: 24px;
            border: 3px solid #ccc;
            border-top-color: #3b4151;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin
        {
            to { transform: rotate(360deg); }
        }

        .error
        {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            color: #a94442;
            background: #f2dede;
            padding: 20px;
            flex-direction: column;
        }

        .error pre
        {
            background: #fff;
            padding: 12px;
            border-radius: 4px;
            max-width: 800px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>Loading API specs...</span>
    </div>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
    (function()
    {
        "use strict";

        ///
        /// Base URL for spec JSON files.
        /// If served from the Boost.Beast server, point to a static file route.
        /// If opened as a local file, use relative paths to backend/json/.
        ///
        var SPEC_BASE_URL = "/swagger/specs";

        // Discovered at runtime from the server's /swagger/specs endpoint.
        var SPEC_FILES = [];

        ///
        /// Deep merge: entries from src overwrite or extend dst.
        /// Arrays are concatenated (not replaced).
        ///
        function deepMerge(dst, src)
        {
            if (!src)
            {
                return dst;
            }

            var keys = Object.keys(src);
            for (var i = 0; i < keys.length; i++)
            {
                var key = keys[i];
                var srcVal = src[key];
                var dstVal = dst[key];

                if (Array.isArray(srcVal))
                {
                    dst[key] = Array.isArray(dstVal)
                        ? dstVal.concat(srcVal)
                        : srcVal.slice();
                }
                else if (srcVal && typeof srcVal === "object")
                {
                    dst[key] = (dstVal && typeof dstVal === "object")
                        ? deepMerge(dstVal, srcVal)
                        : JSON.parse(JSON.stringify(srcVal));
                }
                else
                {
                    dst[key] = srcVal;
                }
            }

            return dst;
        }

        ///
        /// Merge an array of OpenAPI specs into one combined spec.
        ///
        function mergeSpecs(specs)
        {
            var merged =
            {
                openapi: "3.1.0",
                info:
                {
                    title: (specs[0] && specs[0].info && specs[0].info.title)
                           || "API Specification",
                    version: (specs[0] && specs[0].info && specs[0].info.version)
                             || "0.1.0",
                    description: "Combined API specification."
                },
                servers: [
                    {
                        url: window.location.origin,
                        description: "Local server"
                    }
                ],
                tags: [],
                paths: {},
                components:
                {
                    schemas: {},
                    parameters: {},
                    securitySchemes: {}
                },
                security: []
            };

            var seenTags = {};

            for (var i = 0; i < specs.length; i++)
            {
                var spec = specs[i];
                if (!spec)
                {
                    continue;
                }

                // Merge paths
                if (spec.paths)
                {
                    deepMerge(merged.paths, spec.paths);
                }

                // Merge tags (deduplicate by name)
                if (spec.tags)
                {
                    for (var t = 0; t < spec.tags.length; t++)
                    {
                        var tag = spec.tags[t];
                        if (!seenTags[tag.name])
                        {
                            seenTags[tag.name] = true;
                            merged.tags.push(tag);
                        }
                    }
                }

                // Merge components
                if (spec.components)
                {
                    if (spec.components.schemas)
                    {
                        deepMerge(merged.components.schemas, spec.components.schemas);
                    }
                    if (spec.components.parameters)
                    {
                        deepMerge(merged.components.parameters, spec.components.parameters);
                    }
                    if (spec.components.securitySchemes)
                    {
                        deepMerge(merged.components.securitySchemes, spec.components.securitySchemes);
                    }
                }

                // Merge security (take first non-empty)
                if (spec.security && spec.security.length > 0 && merged.security.length === 0)
                {
                    merged.security = spec.security;
                }
            }

            // Sort tags alphabetically for consistent ordering
            merged.tags.sort(function(a, b)
            {
                return a.name.localeCompare(b.name);
            });

            return merged;
        }

        ///
        /// Discover available spec files from the server.
        ///
        function discoverSpecs()
        {
            return fetch(SPEC_BASE_URL)
                .then(function(resp) { return resp.json(); })
                .catch(function() { return []; });
        }

        ///
        /// Fetch all spec files and merge them.
        ///
        function loadAllSpecs()
        {
            return discoverSpecs().then(function(files)
            {
                if (!files || files.length === 0)
                {
                    throw new Error("No specs found at " + SPEC_BASE_URL);
                }
                SPEC_FILES = files;
                document.getElementById("loading").innerHTML =
                    "<div class=\"spinner\"></div><span>Loading " + files.length + " spec(s)...</span>";

                var promises = files.map(function(filename)
                {
                    var url = SPEC_BASE_URL + "/" + filename;
                    return fetch(url)
                        .then(function(resp)
                        {
                            if (!resp.ok)
                            {
                                throw new Error("Failed to fetch " + url + ": " + resp.status);
                            }
                            return resp.json();
                        })
                        .catch(function(err)
                        {
                            console.warn("Skipping " + filename + ": " + err.message);
                            return null;
                        });
                });

                return Promise.all(promises).then(function(specs)
                {
                    var loaded = specs.filter(function(s) { return s !== null; });
                    if (loaded.length === 0)
                    {
                        throw new Error("No specs loaded. Check SPEC_BASE_URL: " + SPEC_BASE_URL);
                    }
                    console.log("Loaded " + loaded.length + " of " + files.length + " specs");
                    return mergeSpecs(loaded);
                });
            });
        }

        ///
        /// Initialize Swagger UI with the merged spec.
        ///
        loadAllSpecs()
            .then(function(mergedSpec)
            {
                document.getElementById("loading").style.display = "none";

                // Show all paths together — no tag-based grouping.
                mergedSpec.tags = [];

                SwaggerUIBundle(
                {
                    spec: mergedSpec,
                    dom_id: "#swagger-ui",
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIBundle.SwaggerUIStandalonePreset
                    ],
                    layout: "BaseLayout",
                    defaultModelsExpandDepth: 1,
                    defaultModelExpandDepth: 1,
                    docExpansion: "list",
                    filter: true,
                    showRequestHeaders: true,
                    tryItOutEnabled: true
                });
            })
            .catch(function(err)
            {
                document.getElementById("loading").style.display = "none";
                var errorDiv = document.createElement("div");
                errorDiv.className = "error";
                errorDiv.innerHTML =
                    "<h2>Failed to load API specs</h2>" +
                    "<pre>" + err.message + "</pre>" +
                    "<p>Ensure the spec files are accessible at: <code>" + SPEC_BASE_URL + "</code></p>";
                document.body.appendChild(errorDiv);
            });
    })();
    </script>
</body>
</html>
